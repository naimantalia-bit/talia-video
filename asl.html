<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASL Alphabet — Talia Naiman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000; --bg-card:#120C1C; --ink:#ffffff; --ink-dim:#c7bfe0;
    --accent:#8A4DFF; --pink:#F0399F; --lime:#D6F32C;
    --serif:"Baloo 2","Fredoka",sans-serif;
    --sans:"Baloo 2","Fredoka",sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{background:var(--bg); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; overflow-x:hidden}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--pink); outline-offset:3px; border-radius:3px}
  img{display:block; max-width:100%}

  header{position:sticky; top:0; z-index:20; display:flex; align-items:center;
    justify-content:space-between; padding:1.3rem 4%; background:var(--bg);
    border-bottom:1px solid rgba(255,255,255,.1)}
  .logo{font-family:var(--serif); font-weight:700; font-size:1.15rem; letter-spacing:.04em;
    text-transform:uppercase; text-decoration:none}
  .back{display:inline-flex; align-items:center; gap:.5rem; font-size:.82rem;
    letter-spacing:.08em; text-transform:uppercase; text-decoration:none; color:var(--ink)}
  .back svg{width:1.1em; height:1.1em}

  main{max-width:1080px; margin:0 auto; padding:0 4% 6rem}

  .hero{position:relative; display:flex; flex-direction:column;
    align-items:center; gap:1.6rem; text-align:center; padding:6rem 4% 2rem}
  .hero-content{display:flex; flex-direction:column; align-items:center; gap:1rem}
  .eyebrow{color:var(--pink); font-weight:700; font-size:.78rem; letter-spacing:.26em; text-transform:uppercase}
  .hero h1{font-family:var(--serif); font-weight:800; font-size:clamp(2.6rem,6vw,4.2rem);
    letter-spacing:-.01em; line-height:1.2; text-wrap:balance}
  .hero h1 .marker{display:inline-block; background:var(--lime); color:#000;
    padding:.05em .2em; border-radius:2px; transform:rotate(-1.5deg)}
  .hero p{max-width:56ch; color:var(--ink-dim); font-size:1.08rem; line-height:1.6}
  .hero-gif{width:260px; max-width:60vw; filter:invert(1); mix-blend-mode:screen}

  .section-label{display:flex; align-items:center; gap:.9rem; margin:0 0 1.6rem;
    font-size:.78rem; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-dim)}
  .section-label::after{content:""; flex:1; height:1px; background:rgba(255,255,255,.15)}

  .signs-grid{display:grid; grid-template-columns:repeat(6, 1fr); gap:1rem; margin-bottom:5rem}
  .sign-card{cursor:pointer; text-align:center; display:flex; flex-direction:column; gap:.5rem}
  .sign-card figure{background:#fff; border-radius:8px; overflow:hidden; aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center; transition:transform .2s ease}
  .sign-card:hover figure{transform:scale(1.05)}
  .sign-card img{width:100%; height:100%; object-fit:contain; padding:.5rem}
  .sign-card figcaption{font-size:.75rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-dim)}

  .film-single{display:flex; flex-direction:column; align-items:center; gap:1.1rem}
  .film-frame{position:relative; width:100%; max-width:640px; aspect-ratio:16/9; border-radius:8px;
    overflow:hidden; background:var(--bg-card); cursor:pointer; border:none; padding:0; font:inherit; display:block}
  .film-frame img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .film-frame .play-btn{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.25); transition:background-color .2s}
  .film-frame:hover .play-btn{background:rgba(0,0,0,.4)}
  .film-frame .play-btn svg{width:64px; height:64px; filter:drop-shadow(0 2px 10px rgba(0,0,0,.6))}
  .film-caption{font-family:var(--serif); font-weight:700; font-size:1.1rem; text-align:center}

  #videoLightbox{position:fixed; inset:0; z-index:100; display:none; align-items:center;
    justify-content:center; background:rgba(0,0,0,.94); padding:6vh 4vw}
  #videoLightbox.open{display:flex}
  .vlb-frame{position:relative; width:100%; max-width:960px; aspect-ratio:16/9; border-radius:8px;
    overflow:hidden; background:#000}
  .vlb-frame video{width:100%; height:100%; object-fit:contain; display:block}
  .vlb-close{position:absolute; top:-3.4rem; right:0; width:40px; height:40px; border-radius:50%;
    background:rgba(255,255,255,.1); color:#fff; display:flex; align-items:center; justify-content:center}

  #lightbox{position:fixed; inset:0; z-index:100; display:none; align-items:center;
    justify-content:center; background:rgba(0,0,0,.94); padding:6vh 4vw}
  #lightbox.open{display:flex}
  .lb-stage{position:relative; display:flex; align-items:center; gap:1.1rem; max-width:900px; width:100%}
  .lb-frame{flex:1; min-width:0; max-height:78vh; border-radius:8px; overflow:hidden;
    display:flex; align-items:center; justify-content:center; background:#fff}
  .lb-frame img{max-width:100%; max-height:78vh; object-fit:contain; display:block}
  .lb-btn{flex:0 0 auto; width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.1);
    color:#fff; display:flex; align-items:center; justify-content:center; transition:background-color .2s}
  .lb-btn:hover{background:rgba(255,255,255,.2)}
  .lb-btn svg{width:1.4rem; height:1.4rem}
  .lb-close{position:absolute; top:-3.4rem; right:0; width:40px; height:40px; border-radius:50%;
    background:rgba(255,255,255,.1); color:#fff; display:flex; align-items:center; justify-content:center}
  .lb-caption{position:absolute; left:0; right:0; bottom:-2.3rem; text-align:center;
    color:var(--ink-dim); font-size:.8rem; letter-spacing:.08em; text-transform:uppercase}

  footer{padding:3rem 4% 4rem; text-align:center; color:var(--ink-dim); font-size:.85rem;
    border-top:1px solid rgba(255,255,255,.1)}
  footer a{text-decoration:none; font-weight:700}

  @media (max-width:820px){ .signs-grid{grid-template-columns:repeat(4, 1fr)} }
  @media (max-width:520px){ .signs-grid{grid-template-columns:repeat(3, 1fr)} }
  @media (max-width:640px){ .lb-stage{gap:.6rem} .lb-btn{width:38px; height:38px} }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important; scroll-behavior:auto !important} }
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">Talia Naiman</a>
  <a class="back" href="index.html#row-ai">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
    Back to portfolio
  </a>
</header>

<main>
  <section class="hero">
    <div class="hero-content">
      <span class="eyebrow">AI Concept Series</span>
      <h1>The ASL <span class="marker">Alphabet</span></h1>
      <p>Twenty-six letters, twenty-six original illustrations — each sign-language
         handshape paired with an animal that shares its letter.</p>
    </div>
    <img class="hero-gif" src="media/asl/asl-alphabet.gif" alt="ASL alphabet, animated">
  </section>

  <div class="section-label">The Letters — Original Illustrations</div>
  <div class="signs-grid">
    <div class="sign-card"><figure><img src="media/asl/a.jpg" alt="ASL letter A illustration"></figure><figcaption>A</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/b.jpg" alt="ASL letter B illustration"></figure><figcaption>B</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/c.jpg" alt="ASL letter C illustration"></figure><figcaption>C</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/d.jpg" alt="ASL letter D illustration"></figure><figcaption>D</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/e.jpg" alt="ASL letter E illustration"></figure><figcaption>E</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/f.jpg" alt="ASL letter F illustration"></figure><figcaption>F</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/g.jpg" alt="ASL letter G illustration"></figure><figcaption>G</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/h.jpg" alt="ASL letter H illustration"></figure><figcaption>H</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/i.jpg" alt="ASL letter I illustration"></figure><figcaption>I</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/j.jpg" alt="ASL letter J illustration"></figure><figcaption>J</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/k.jpg" alt="ASL letter K illustration"></figure><figcaption>K</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/l.jpg" alt="ASL letter L illustration"></figure><figcaption>L</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/m.jpg" alt="ASL letter M illustration"></figure><figcaption>M</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/n.jpg" alt="ASL letter N illustration"></figure><figcaption>N</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/o.jpg" alt="ASL letter O illustration"></figure><figcaption>O</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/p.jpg" alt="ASL letter P illustration"></figure><figcaption>P</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/q.jpg" alt="ASL letter Q illustration"></figure><figcaption>Q</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/r.jpg" alt="ASL letter R illustration"></figure><figcaption>R</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/s.jpg" alt="ASL letter S illustration"></figure><figcaption>S</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/t.jpg" alt="ASL letter T illustration"></figure><figcaption>T</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/u.jpg" alt="ASL letter U illustration"></figure><figcaption>U</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/v.jpg" alt="ASL letter V illustration"></figure><figcaption>V</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/w.jpg" alt="ASL letter W illustration"></figure><figcaption>W</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/x.jpg" alt="ASL letter X illustration"></figure><figcaption>X</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/y.jpg" alt="ASL letter Y illustration"></figure><figcaption>Y</figcaption></div>
    <div class="sign-card"><figure><img src="media/asl/z.jpg" alt="ASL letter Z illustration"></figure><figcaption>Z</figcaption></div>
  </div>

  <div class="section-label">The Film</div>
  <div class="film-single">
    <button class="film-frame" id="filmPlayBtn" aria-label="Play film, enlarged">
      <img src="media/asl/asl-poster.jpg" alt="ASL film">
      <span class="play-btn">
        <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="23" fill="rgba(0,0,0,.5)" stroke="#fff" stroke-width="2"/><path d="M19 15l14 9-14 9z" fill="#fff"/></svg>
      </span>
    </button>
    <div class="film-caption">ASL Alphabet Film</div>
  </div>
</main>

<footer>
  <a href="index.html">← Back to the full portfolio</a>
</footer>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Letter illustration viewer">
  <div class="lb-stage">
    <button class="lb-btn lb-prev" aria-label="Previous letter">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="lb-frame"><img id="lbImg" alt=""></div>
    <button class="lb-btn lb-next" aria-label="Next letter">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="lb-close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="lb-caption" id="lbCaption"></div>
  </div>
</div>

<div id="videoLightbox" role="dialog" aria-modal="true" aria-label="Film player">
  <div class="vlb-frame">
    <video id="vlbVideo" controls playsinline></video>
    <button class="vlb-close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
</div>

<script>
/* ---------- letters lightbox ---------- */
(function(){
  const cards=[...document.querySelectorAll('.sign-card')];
  const lb=document.getElementById('lightbox');
  const lbImg=document.getElementById('lbImg');
  const lbCaption=document.getElementById('lbCaption');
  let i=0;
  function render(){
    const card=cards[i], img=card.querySelector('img');
    lbImg.src=img.src; lbImg.alt=img.alt;
    lbCaption.textContent=`${card.querySelector('figcaption').textContent} — ${i+1} / ${cards.length}`;
  }
  function open(idx){ i=idx; render(); lb.classList.add('open'); document.body.style.overflow='hidden'; }
  function close(){ lb.classList.remove('open'); document.body.style.overflow=''; }
  cards.forEach((card,idx)=>card.addEventListener('click',()=>open(idx)));
  lb.querySelector('.lb-prev').onclick=()=>{ i=(i-1+cards.length)%cards.length; render(); };
  lb.querySelector('.lb-next').onclick=()=>{ i=(i+1)%cards.length; render(); };
  lb.querySelector('.lb-close').onclick=close;
  lb.addEventListener('click',e=>{ if(e.target===lb) close(); });
  document.addEventListener('keydown',e=>{
    if(!lb.classList.contains('open')) return;
    if(e.key==='Escape') close();
    if(e.key==='ArrowLeft') lb.querySelector('.lb-prev').click();
    if(e.key==='ArrowRight') lb.querySelector('.lb-next').click();
  });
})();

/* ---------- film: click enlarges into a video lightbox ---------- */
(function(){
  const playBtn=document.getElementById('filmPlayBtn');
  const vlb=document.getElementById('videoLightbox');
  const vlbVideo=document.getElementById('vlbVideo');
  function openVideo(){
    vlbVideo.src='media/asl/asl.mp4';
    vlb.classList.add('open');
    document.body.style.overflow='hidden';
    vlbVideo.play().catch(()=>{});
  }
  function closeVideo(){
    vlbVideo.pause(); vlbVideo.removeAttribute('src'); vlbVideo.load();
    vlb.classList.remove('open');
    document.body.style.overflow='';
  }
  playBtn.addEventListener('click', openVideo);
  vlb.querySelector('.vlb-close').addEventListener('click', closeVideo);
  vlb.addEventListener('click', e=>{ if(e.target===vlb) closeVideo(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && vlb.classList.contains('open')) closeVideo(); });
})();
</script>

</body>
</html>
