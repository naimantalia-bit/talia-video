<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zodiac — Talia Naiman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000; --bg-card:#120C1C; --ink:#ffffff; --ink-dim:#c7bfe0;
    --accent:#8A4DFF; --pink:#F0399F; --lime:#D6F32C; --gold:#E8C468;
    --serif:"Baloo 2","Fredoka",sans-serif;
    --sans:"Baloo 2","Fredoka",sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{background:var(--bg); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; overflow-x:hidden}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--pink); outline-offset:3px; border-radius:3px}
  img{display:block; max-width:100%}

  header{position:sticky; top:0; z-index:20; display:flex; align-items:center;
    justify-content:space-between; padding:1.3rem 4%; background:var(--bg);
    border-bottom:1px solid rgba(255,255,255,.1)}
  .logo{font-family:var(--serif); font-weight:700; font-size:1.15rem; letter-spacing:.04em;
    text-transform:uppercase; text-decoration:none}
  .back{display:inline-flex; align-items:center; gap:.5rem; font-size:.82rem;
    letter-spacing:.08em; text-transform:uppercase; text-decoration:none; color:var(--ink)}
  .back svg{width:1.1em; height:1.1em}

  main{max-width:1080px; margin:0 auto; padding:0 4% 6rem}

  .hero{position:relative; min-height:60vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1rem; text-align:center;
    margin:0 -4% 4rem; padding:6rem 4% 4rem; overflow:hidden}
  .hero-bg{position:absolute; inset:0; z-index:0}
  .hero-bg img{width:100%; height:100%; object-fit:cover; opacity:.55}
  .hero-bg::after{content:""; position:absolute; inset:0;
    background:linear-gradient(to bottom, rgba(0,0,0,.35) 0%, var(--bg) 92%)}
  .hero-content{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:1rem}
  .eyebrow{color:var(--pink); font-weight:700; font-size:.78rem; letter-spacing:.26em; text-transform:uppercase}
  .hero h1{font-family:var(--serif); font-weight:800; font-size:clamp(2.6rem,6vw,4.2rem);
    letter-spacing:-.01em; line-height:1.2; text-wrap:balance}
  .hero h1 .marker{display:inline-block; background:var(--lime); color:#000;
    padding:.05em .2em; border-radius:2px; transform:rotate(-1.5deg)}
  .hero p{max-width:56ch; color:var(--ink-dim); font-size:1.08rem; line-height:1.6}

  .section-label{display:flex; align-items:center; gap:.9rem; margin:0 0 1.6rem;
    font-size:.78rem; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-dim)}
  .section-label::after{content:""; flex:1; height:1px; background:rgba(255,255,255,.15)}

  .signs-grid{display:grid; grid-template-columns:repeat(6, 1fr); gap:1rem; margin-bottom:5rem}
  .sign-card{cursor:pointer; text-align:center; display:flex; flex-direction:column; gap:.5rem}
  .sign-card figure{background:#fff; border-radius:8px; overflow:hidden; aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center; transition:transform .2s ease}
  .sign-card:hover figure{transform:scale(1.05)}
  .sign-card img{width:100%; height:100%; object-fit:contain; padding:.6rem}
  .sign-card figcaption{font-size:.75rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-dim)}

  .film-carousel{display:flex; flex-direction:column; align-items:center; gap:1.1rem}
  .film-stage{position:relative; display:flex; align-items:center; gap:1rem; width:100%; max-width:640px}
  .film-frame{position:relative; flex:1; aspect-ratio:16/9; border-radius:8px; overflow:hidden;
    background:var(--bg-card); display:flex; align-items:center; justify-content:center}
  .film-frame img,.film-frame video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .film-frame img[hidden],.film-frame video[hidden]{display:none}
  .film-frame video{cursor:default}
  .film-frame .play-btn{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.25); transition:background-color .2s}
  .film-frame .play-btn:hover{background:rgba(0,0,0,.4)}
  .film-frame .play-btn svg{width:64px; height:64px; filter:drop-shadow(0 2px 10px rgba(0,0,0,.6))}
  .film-btn{flex:0 0 auto; width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.08);
    color:#fff; display:flex; align-items:center; justify-content:center; transition:background-color .2s, transform .15s}
  .film-btn:hover{background:rgba(255,255,255,.18); transform:scale(1.06)}
  .film-btn svg{width:1.5rem; height:1.5rem}
  .film-caption{display:flex; flex-direction:column; align-items:center; gap:.3rem; text-align:center}
  .film-caption strong{font-family:var(--serif); font-weight:700; font-size:1.1rem}
  .film-counter{font-size:.72rem; color:var(--ink-dim); letter-spacing:.12em; text-transform:uppercase; font-variant-numeric:tabular-nums}

  footer{padding:3rem 4% 4rem; text-align:center; color:var(--ink-dim); font-size:.85rem;
    border-top:1px solid rgba(255,255,255,.1)}
  footer a{text-decoration:none; font-weight:700}

  @media (max-width:820px){
    .signs-grid{grid-template-columns:repeat(4, 1fr)}
  }
  @media (max-width:520px){
    .signs-grid{grid-template-columns:repeat(3, 1fr)}
    .film-stage{gap:.5rem}
    .film-btn{width:36px; height:36px}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important; scroll-behavior:auto !important} }

  /* ---------- Gallery lightbox (signs) ---------- */
  #lightbox{position:fixed; inset:0; z-index:100; display:none; align-items:center;
    justify-content:center; background:rgba(0,0,0,.94); padding:6vh 4vw}
  #lightbox.open{display:flex}
  .lb-stage{position:relative; display:flex; align-items:center; gap:1.1rem; max-width:900px; width:100%}
  .lb-frame{flex:1; min-width:0; max-height:78vh; border-radius:8px; overflow:hidden;
    display:flex; align-items:center; justify-content:center; background:#fff}
  .lb-frame img{max-width:100%; max-height:78vh; object-fit:contain; display:block}
  .lb-btn{flex:0 0 auto; width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.1);
    color:#fff; display:flex; align-items:center; justify-content:center; transition:background-color .2s}
  .lb-btn:hover{background:rgba(255,255,255,.2)}
  .lb-btn svg{width:1.4rem; height:1.4rem}
  .lb-close{position:absolute; top:-3.4rem; right:0; width:40px; height:40px; border-radius:50%;
    background:rgba(255,255,255,.1); color:#fff; display:flex; align-items:center; justify-content:center}
  .lb-caption{position:absolute; left:0; right:0; bottom:-2.3rem; text-align:center;
    color:var(--ink-dim); font-size:.8rem; letter-spacing:.08em; text-transform:uppercase}
  @media (max-width:640px){ .lb-stage{gap:.6rem} .lb-btn{width:38px; height:38px} }
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">Talia Naiman</a>
  <a class="back" href="index.html#row-ai">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
    Back to portfolio
  </a>
</header>

<main>
  <section class="hero">
    <div class="hero-bg"><img src="media/zodiac/wheel-poster.jpg" alt=""></div>
    <div class="hero-content">
      <span class="eyebrow">AI Concept Series</span>
      <h1>The <span class="marker">Zodiac</span> Wheel</h1>
      <p>Twelve signs, twelve original illustrations, and a short film for each — an
         AI-assisted concept series built around a hand-drawn zodiac wheel.</p>
    </div>
  </section>

  <div class="section-label">The Signs — Original Illustrations</div>
  <div class="signs-grid">
    <div class="sign-card"><figure><img src="media/zodiac/aries.jpg" alt="Aries illustration"></figure><figcaption>Aries</figcaption></div>
    <div class="sign-card"><figure><img src="media/zodiac/taurus.jpg" alt="Taurus illustration"></figure><figcaption>Taurus</figcaption></div>
    <div class="sign-card"><figure><img src="media/zodiac/gemini.jpg" alt="Gemini illustration"></figure><figcaption>Gemini</figcaption></div>
    <div class="sign-card"><figure><img src="media/zodiac/cancer.jpg" alt="Cancer illustration"></figure><figcaption>Cancer</figcaption></div>
    <div class="sign-card"><figure><img src="media/zodiac/leo.jpg" alt="Leo illustration"></figure><figcaption>Leo</figcaption></div>
    <div class="sign-card"><figure><img src="media/zodiac/virgo.jpg" alt="Virgo illustration"></figure><figcaption>Virgo</figcaption></div>
    <div class="sign-card"><figure><img src="media/zodiac/libra.jpg" alt="Libra illustration"></figure><figcaption>Libra</figcaption></div>
    <div class="sign-card"><figure><img src="media/zodiac/scorpio.jpg" alt="Scorpio illustration"></figure><figcaption>Scorpio</figcaption></div>
    <div class="sign-card"><figure><img src="media/zodiac/sagittarius.jpg" alt="Sagittarius illustration"></figure><figcaption>Sagittarius</figcaption></div>
    <div class="sign-card"><figure><img src="media/zodiac/capricorn.jpg" alt="Capricorn illustration"></figure><figcaption>Capricorn</figcaption></div>
    <div class="sign-card"><figure><img src="media/zodiac/aquarius.jpg" alt="Aquarius illustration"></figure><figcaption>Aquarius</figcaption></div>
    <div class="sign-card"><figure><img src="media/zodiac/pisces.jpg" alt="Pisces illustration"></figure><figcaption>Pisces</figcaption></div>
  </div>

  <div class="section-label">The Films</div>
  <div class="film-carousel">
    <div class="film-stage">
      <button class="film-btn film-prev" aria-label="Previous film">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="film-frame">
        <img id="filmPoster" alt="">
        <video id="filmVideo" controls playsinline hidden></video>
        <button class="play-btn" id="filmPlayBtn" aria-label="Play film">
          <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="23" fill="rgba(0,0,0,.5)" stroke="#fff" stroke-width="2"/><path d="M19 15l14 9-14 9z" fill="#fff"/></svg>
        </button>
      </div>
      <button class="film-btn film-next" aria-label="Next film">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <div class="film-caption">
      <strong id="filmTitle"></strong>
      <span class="film-counter" id="filmCounter"></span>
    </div>
  </div>
</main>

<footer>
  <a href="index.html">← Back to the full portfolio</a>
</footer>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Sign illustration viewer">
  <div class="lb-stage">
    <button class="lb-btn lb-prev" aria-label="Previous sign">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="lb-frame"><img id="lbImg" alt=""></div>
    <button class="lb-btn lb-next" aria-label="Next sign">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="lb-close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="lb-caption" id="lbCaption"></div>
  </div>
</div>

<script>
/* ---------- signs lightbox ---------- */
(function(){
  const cards=[...document.querySelectorAll('.sign-card')];
  const lb=document.getElementById('lightbox');
  const lbImg=document.getElementById('lbImg');
  const lbCaption=document.getElementById('lbCaption');
  let i=0;
  function render(){
    const card=cards[i], img=card.querySelector('img');
    lbImg.src=img.src; lbImg.alt=img.alt;
    lbCaption.textContent=`${card.querySelector('figcaption').textContent} — ${i+1} / ${cards.length}`;
  }
  function open(idx){ i=idx; render(); lb.classList.add('open'); document.body.style.overflow='hidden'; }
  function close(){ lb.classList.remove('open'); document.body.style.overflow=''; }
  cards.forEach((card,idx)=>card.addEventListener('click',()=>open(idx)));
  lb.querySelector('.lb-prev').onclick=()=>{ i=(i-1+cards.length)%cards.length; render(); };
  lb.querySelector('.lb-next').onclick=()=>{ i=(i+1)%cards.length; render(); };
  lb.querySelector('.lb-close').onclick=close;
  lb.addEventListener('click',e=>{ if(e.target===lb) close(); });
  document.addEventListener('keydown',e=>{
    if(!lb.classList.contains('open')) return;
    if(e.key==='Escape') close();
    if(e.key==='ArrowLeft') lb.querySelector('.lb-prev').click();
    if(e.key==='ArrowRight') lb.querySelector('.lb-next').click();
  });
})();

/* ---------- films carousel ---------- */
(function(){
  const FILMS=[
    {title:"Aries", poster:"media/zodiac/aries-poster.jpg", video:"media/zodiac/aries.mp4"},
    {title:"Taurus", poster:"media/zodiac/taurus-poster.jpg", video:"media/zodiac/taurus.mp4"},
    {title:"Pisces", poster:"media/zodiac/pisces-poster.jpg", video:"media/zodiac/pisces.mp4"}
  ];
  let i=0;
  const poster=document.getElementById('filmPoster');
  const video=document.getElementById('filmVideo');
  const playBtn=document.getElementById('filmPlayBtn');
  const title=document.getElementById('filmTitle');
  const counter=document.getElementById('filmCounter');
  function render(){
    const f=FILMS[i];
    video.pause(); video.removeAttribute('src'); video.load(); video.hidden=true;
    poster.src=f.poster; poster.hidden=false; playBtn.hidden=false;
    title.textContent=f.title;
    counter.textContent=`${i+1} / ${FILMS.length}`;
  }
  playBtn.addEventListener('click',()=>{
    const f=FILMS[i];
    video.src=f.video; video.hidden=false; poster.hidden=true; playBtn.hidden=true;
    video.play().catch(()=>{});
  });
  document.querySelector('.film-prev').onclick=()=>{ i=(i-1+FILMS.length)%FILMS.length; render(); };
  document.querySelector('.film-next').onclick=()=>{ i=(i+1)%FILMS.length; render(); };
  render();
})();
</script>

</body>
</html>
